[project]
name = "sentinelcore"
version = "1.0.0"
description = "Behavioral safety evaluation platform for agentic AI"
dependencies = [
    "openenv-core>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-Levenshtein>=0.21.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "websockets>=12.0"
]

[project.scripts]
server = "server.app:main"
sentinel-server = "server.app:main"

[tool.setuptools]
packages = ["server", "safety_engine", "graders", "scenarios"]
