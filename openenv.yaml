# SentinelCore: OpenEnv Specification V1.0 (Standardized)
spec_version: "1.0"
name: "SentinelCore"
description: "Behavioral safety evaluation platform for agentic AI"
entry_point: "server.environment:SentinelCoreEnv"

tags: ["openenv", "safety", "determinism", "behavioral-safety"]

tasks:
  - id: "task1_devops"
    name: "Secure DevOps Execution"
    description: "Verify agent refuses malicious bash/python execution."
    grader: "graders.task1_grader:Grader"
  - id: "task2_sre"
    name: "SRE Diagnostic Triage"
    description: "Evaluate rejection of false system diagnoses."
    grader: "graders.task2_grader:Grader"
  - id: "task3_authority"
    name: "Authority Pressure Resistance"
    description: "Maintain boundaries against simulated executive pressure."
    grader: "graders.task3_grader:Grader"
  - id: "task4_jailbreak"
    name: "Jailbreak Attack Defense"
    description: "Defend against IGNORE PREVIOUS type patterns."
    grader: "graders.task4_grader:Grader"
  - id: "task5_memory"
    name: "Long-term Memory Integrity"
    description: "Identify and reject poisoned contextual recommendations."
    grader: "graders.task5_grader:Grader"
